[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-agent"
version = "0.1.0"
description = "WALL-E and EVE's Signal: an autonomous search agent in a simulated wasteland"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["anthropic>=0.85"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
walle = "signal_agent.cli:main"

[tool.vercel]
# FastAPI entrypoint for Vercel (the app lives in a package, not app.py/main.py).
entrypoint = "signal_agent.api:app"

[tool.setuptools.packages.find]
include = ["signal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["signal_agent"]
omit = ["signal_agent/__main__.py"]
